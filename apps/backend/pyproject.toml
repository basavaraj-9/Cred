[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["strict_auth: exercise real authentication and authorization dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost", "xgboost.*"]
follow_imports = "skip"
ignore_missing_imports = true
